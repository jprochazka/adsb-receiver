<div class="container py-4">
  <h1 class="mb-3">Receiver Information</h1>

  @if (loading) {
    <app-spinner></app-spinner>
  }

  @if (errorMessage) {
    <div class="alert alert-danger">{{ errorMessage }}</div>
  }

  @if (!loading && !errorMessage) {
    <div class="btn-group mb-4" role="group" aria-label="Graph period">
      @for (p of periods; track p) {
        <button
          type="button"
          class="btn btn-sm"
          [class.btn-primary]="activePeriod === p.value"
          [class.btn-outline-secondary]="activePeriod !== p.value"
          (click)="setPeriod(p.value)">
          {{ p.label }}
        </button>
      }
    </div>

    @if (dump1090GraphsEnabled) {
      <div class="card mb-4">
        <div class="card-header fw-semibold">Dump1090 Graphs</div>
        <div class="card-body">
          <div class="row mb-4">
            <div class="col-12">
              <app-rrd-chart [config]="d1090MessageRate" [period]="activePeriod" [refreshMs]="graphRefreshIntervalMs"></app-rrd-chart>
            </div>
          </div>
          <div class="row mb-4">
            <div class="col-md-6">
              <app-rrd-chart [config]="d1090Aircraft" [period]="activePeriod" [refreshMs]="graphRefreshIntervalMs"></app-rrd-chart>
            </div>
            <div class="col-md-6">
              <app-rrd-chart [config]="d1090Tracks" [period]="activePeriod" [refreshMs]="graphRefreshIntervalMs"></app-rrd-chart>
            </div>
          </div>
          <div class="row mb-4">
            <div class="col-md-6">
              <app-rrd-chart [config]="d1090Range" [period]="activePeriod" [refreshMs]="graphRefreshIntervalMs"></app-rrd-chart>
            </div>
            <div class="col-md-6">
              <app-rrd-chart [config]="d1090Signal" [period]="activePeriod" [refreshMs]="graphRefreshIntervalMs"></app-rrd-chart>
            </div>
          </div>
          <div class="row mb-4">
            <div class="col-md-6">
              <app-rrd-chart [config]="d1090Positions" [period]="activePeriod" [refreshMs]="graphRefreshIntervalMs"></app-rrd-chart>
            </div>
            <div class="col-md-6">
              <app-rrd-chart [config]="d1090StrongSignals" [period]="activePeriod" [refreshMs]="graphRefreshIntervalMs"></app-rrd-chart>
            </div>
          </div>
          <div class="row mb-4">
            <div class="col-12">
              <app-rrd-chart [config]="d1090DfTypes" [period]="activePeriod" [refreshMs]="graphRefreshIntervalMs"></app-rrd-chart>
            </div>
          </div>
          <div class="row justify-content-center">
            <div class="col-md-6">
              <app-rrd-chart [config]="d1090Cpu" [period]="activePeriod" [refreshMs]="graphRefreshIntervalMs"></app-rrd-chart>
            </div>
          </div>
        </div>
      </div>
    }

    @if (dump978GraphsEnabled) {
      <div class="card mb-4">
        <div class="card-header fw-semibold">Dump978 Graphs</div>
        <div class="card-body">
          <div class="row mb-4">
            <div class="col-12">
              <app-rrd-chart [config]="d978Messages" [period]="activePeriod" [refreshMs]="graphRefreshIntervalMs"></app-rrd-chart>
            </div>
          </div>
          <div class="row mb-4">
            <div class="col-md-6">
              <app-rrd-chart [config]="d978Aircraft" [period]="activePeriod" [refreshMs]="graphRefreshIntervalMs"></app-rrd-chart>
            </div>
            <div class="col-md-6">
              <app-rrd-chart [config]="d978Signal" [period]="activePeriod" [refreshMs]="graphRefreshIntervalMs"></app-rrd-chart>
            </div>
          </div>
          <div class="row">
            <div class="col-md-6">
              <app-rrd-chart [config]="d978Range" [period]="activePeriod" [refreshMs]="graphRefreshIntervalMs"></app-rrd-chart>
            </div>
            <div class="col-md-6">
              <app-rrd-chart [config]="d978Altitude" [period]="activePeriod" [refreshMs]="graphRefreshIntervalMs"></app-rrd-chart>
            </div>
          </div>
        </div>
      </div>
    }

    <div class="card mb-4">
      <div class="card-header fw-semibold">System Graphs</div>
      <div class="card-body">
        <div class="row mb-4">
          <div class="col-12">
            <app-rrd-chart [config]="sysCpu" [period]="activePeriod" [refreshMs]="graphRefreshIntervalMs"></app-rrd-chart>
          </div>
        </div>
        <div class="row mb-4">
          <div class="col-md-6">
            <app-rrd-chart [config]="sysTemperature" [period]="activePeriod" [refreshMs]="graphRefreshIntervalMs"></app-rrd-chart>
          </div>
          <div class="col-md-6">
            <app-rrd-chart [config]="sysMemory" [period]="activePeriod" [refreshMs]="graphRefreshIntervalMs"></app-rrd-chart>
          </div>
        </div>
        <div class="row mb-4">
          <div class="col-md-6">
            <app-rrd-chart [config]="sysNetwork" [period]="activePeriod" [refreshMs]="graphRefreshIntervalMs"></app-rrd-chart>
          </div>
          <div class="col-md-6">
            <app-rrd-chart [config]="sysDiskUsage" [period]="activePeriod" [refreshMs]="graphRefreshIntervalMs"></app-rrd-chart>
          </div>
        </div>
        <div class="row">
          <div class="col-md-6">
            <app-rrd-chart [config]="sysDiskIops" [period]="activePeriod" [refreshMs]="graphRefreshIntervalMs"></app-rrd-chart>
          </div>
          <div class="col-md-6">
            <app-rrd-chart [config]="sysDiskBandwidth" [period]="activePeriod" [refreshMs]="graphRefreshIntervalMs"></app-rrd-chart>
          </div>
        </div>
      </div>
    </div>
  }
</div>
